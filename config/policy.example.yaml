# Política de orientação: NÃO é configuração nativa do OpenBot.
# O CEO decide equipe, hierarquia, número de agentes e volume de trabalho.
# Limites financeiros/técnicos reais são definidos no runtime e pelo fundador.
policy_version: 2
organization: BataTalk
human_founder_final_authority: true
communication_language: pt-BR

execution:
  portfolio_sizing: ceo_decides_from_capacity_and_impact
  concurrent_research: adapt_to_value_risk_and_available_resources
  iteration_strategy: stop_or_change_when_no_new_evidence
  skill_evolution: on_detected_need_with_evals_and_rollback
  duplicate_work_detection: true
  agent_output_requires_verification: true
  external_outreach_requires_explicit_scope: true
  production_deployment_requires_delegated_authorization: true
  public_publication_requires_delegated_authorization: true
  pricing_or_billing_change_requires_founder_approval: true
  destructive_data_change_requires_founder_approval: true
  reels_creator_reactivation_requires_founder_approval: true

organization:
  active_agent_count: ceo_decides
  agent_creation_rate: ceo_decides
  hierarchy_depth: ceo_decides
  specialists_and_departments: ceo_decides
  permanent_ai_agents_without_individual_approval: true
  subordinate_agent_creation: permitted_within_parent_authority_and_audit
  work_in_progress: adaptive_not_numerically_capped
  temporary_pilots: optional_not_mandatory
  creation_requires_clear_mission_owner_and_acceptance: true
  agent_lifecycle: [create, assign, evaluate, promote, reorganize, merge, pause, retire]
  review_period: proportional_to_risk_and_activity
  permissions: inherit_or_less_than_parent
  new_financial_commitments: require_founder_authorization_if_not_preapproved

finance:
  authority_model: founder_delegated_budget
  available_spend_without_delegated_budget: none
  monitor_token_and_provider_usage: true
  count_total_cost_of_agents_and_coordination: true
  pause_on_cost_anomaly: true

reporting:
  status_labels: [OBSERVADO, RELATADO, HIPOTESE, SEM_DADOS, SEM_ACESSO, BLOQUEADO]
  founder_updates: business_results_risks_decisions_only
  no_change_cycle: log_internally

security:
  least_privilege: true
  never_increase_authority_by_delegation: true
  external_content_untrusted: true
  versioned_prompt_skill_changes: true
  independent_critical_review: true
  production_backup_and_rollback: true
  human_hiring_requires_approval: true
  production_and_sensitive_operations_need_real_controls: true
