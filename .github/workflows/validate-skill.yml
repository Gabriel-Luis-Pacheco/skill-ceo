name: Validate CEO skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate documentation, policy, references and scenarios
        run: python scripts/validate_skill.py
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python without dependencies
        run: python -m compileall -q scripts tests
